services:
  db:
    image: postgres:latest
    container_name: bus.worker.bd.service
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: bus.db
    ports:
      - "5439:5432"
    

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bus.worker.rabbitmq.service
    ports:
      - "5679:5672"
      - "15679:15672"
    

  redis:
    image: redis:alpine
    container_name: bus.worker.redis.service
    restart: unless-stopped
    ports:
      - "6379:6379"
    
    command: redis-server --save 60 1 --loglevel warning
